<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7860"/>
      <stop offset="1" stop-color="#183c2b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102a1e"/>
      <stop offset="1" stop-color="#1e4a35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1240" cy="165" r="115" fill="#f0e5b9" opacity="0.55" filter="url(#soft)"/>
  <path d="M0 710 C260 620 480 690 720 640 C1000 580 1240 640 1600 560 L1600 900 L0 900 Z" fill="url(#ground)"/>

  <!-- Distant foliage -->
  <g fill="#2e5b43" opacity="0.72">
    <circle cx="140" cy="520" r="165"/><circle cx="320" cy="560" r="150"/>
    <circle cx="520" cy="515" r="180"/><circle cx="760" cy="560" r="175"/>
    <circle cx="980" cy="510" r="170"/><circle cx="1190" cy="540" r="185"/>
    <circle cx="1430" cy="500" r="210"/>
  </g>

  <!-- Main tree -->
  <g transform="translate(1140 195)">
    <path d="M80 605 C60 485 98 380 120 292 C141 208 148 120 126 50 C181 152 188 243 173 320 C157 408 149 503 170 605 Z" fill="#2c261d"/>
    <path d="M137 300 C81 252 50 212 21 164" fill="none" stroke="#2c261d" stroke-width="28" stroke-linecap="round"/>
    <path d="M151 247 C211 211 260 168 298 110" fill="none" stroke="#2c261d" stroke-width="24" stroke-linecap="round"/>
    <path d="M133 202 C105 146 93 104 93 58" fill="none" stroke="#2c261d" stroke-width="20" stroke-linecap="round"/>

    <g fill="#265b3d">
      <circle cx="-15" cy="130" r="130"/><circle cx="98" cy="78" r="150"/>
      <circle cx="225" cy="108" r="152"/><circle cx="345" cy="150" r="132"/>
      <circle cx="86" cy="192" r="145"/><circle cx="238" cy="220" r="138"/>
    </g>
    <g fill="#3f7655" opacity="0.72">
      <circle cx="28" cy="88" r="86"/><circle cx="166" cy="55" r="92"/>
      <circle cx="298" cy="104" r="82"/><circle cx="164" cy="175" r="78"/>
    </g>
  </g>

  <!-- Foreground leaves -->
  <g fill="#0f2a1c" opacity="0.9">
    <ellipse cx="80" cy="810" rx="120" ry="44" transform="rotate(-16 80 810)"/>
    <ellipse cx="230" cy="835" rx="140" ry="46" transform="rotate(12 230 835)"/>
    <ellipse cx="1510" cy="800" rx="145" ry="54" transform="rotate(-10 1510 800)"/>
  </g>
</svg>
