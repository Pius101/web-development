<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="description" content="Swinburne Website" />
	<meta name="keywords" content="Studying at Swinburne University" />
	<meta name="author" content="Jimmy Kimathi Musyimi " />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="styles/style.css" />
	<script src="register.js"></script>

	<title>Swinburne Website</title>
</head>
<body>
	<header>
		<img id="images" src="SwinLogo.png" alt="Swinburne Logo" />
	</header>
	<nav>
		<ul>
			<li><a href="https://www.swinburne.edu.my/contact">Contact Us |</a></li>
			<li><a href="https://www.swinburne.edu.my/hr">Jobs at Swinburne |</a></li>
			<li><a href="https://www.swinburne.edu.my/library/services-for-teachers-2/copyright-at-swinburne.php">Copyright
					and disclaimer |</a></li>
			<li><a href="https://www.swinburne.edu.my/privacy/privacy-collection-notice">Privacy |</a></li>
			<li><a href="https://www.swinburne.edu.my/accessibility-information">Accessibility |</a></li>
			<li><a href="https://www.swinburne.edu.my/feedback">Feedback</a></li>
			<li><a href="register.html">Register</a></li>
		</ul>
	</nav>
	<form id="detail" method="post" action="mailto:102775339@students.swinburne.edu.my" novalidate="novalidate">
		<fieldset>
			<legend>Personal Details:</legend>
			<label for="name">Name:*</label><input type="text" id="name" name="name" required="required" />
			<br />
			<label for="email">Enter your email:*</label><input type="email" id="email" name="email"
				pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required="required" />
			<br />
			<label for="birthday">Birthday:</label><input type="date" id="birthday" name="birthday" />
			<br />
		</fieldset>
		<fieldset>
			<legend>Your unit*</legend>
			<input type="radio" id="COS10005" name="unit" value="COS10005" required="required" />
			<label>COS10005</label>
			<input type="radio" id="COS60004" name="unit" value="COS60004" />
			<label>COS60004</label>
			<input type="radio" id="COS60007" name="unit" value="COS60007" />
			<label>COS60007</label>
			<br />
			<label>Your Tutor:</label>
			<select name="students-tutor" id="tutor">
				<option value="none" selected="selected">---</option>
				<option value="tutor1">Tutor 1</option>
				<option value="tutor2">Tutor 2</option>
				<option value="tutor3">Tutor 3</option>
			</select>
		</fieldset>
		<fieldset id="issues">
			<legend>Issue</legend>
			<input type="checkbox" id="issue1" name="issue1" value="HTML" />
			<label for="issue1">HTML</label>
			<input type="checkbox" id="issue2" name="issue2" value="CSS" />
			<label for="issue2">CSS</label>
			<input type="checkbox" id="issue3" name="issue3" value="Javascript" />
			<label for="issue3">Javascript</label>
			<input type="checkbox" id="issue4" name="issue4" value="PHP" />
			<label for="issue4">PHP</label>
			<input type="checkbox" id="issue5" name="issue5" value="MySQL" />
			<label for="issue5">MySQL</label>
			<br />
			<br />
			<label for="description">Description of Issue</label><br />
			<textarea id="description" name="description" rows="5" cols="33"
				placeholder="Enter comment here"></textarea>
		</fieldset>
		<fieldset>
			<legend>Preffered Date/Time</legend>
			<label for="date">Date:</label>
			<input type="date" id="date" name="date" value="" /><br />
			<label for="time">Time:</label>
			<input type="time" id="time" name="time" />
		</fieldset>
		<input type="submit" value="Register" />
		<input type="reset" value="Reset" />
	</form>
	<footer>

		<p>Posted by: Jimmy Kimathi Musyimi</p>
		<p>Contact information: <a href="mailto:102775339@students.swinburne.edu.my">Jimmy Kimathi Musyimi</a></p>
	</footer>
</body>

</html>
