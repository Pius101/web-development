<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Image Changer with Fade</title>
    <style>
        .fade-container {
            width: 500px;
            height: 350px;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .fade-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .fade-container img.active {
            opacity: 1;
        }
    </style>
</head>

<body>
    <h1>Automatic Fading Image Rotator</h1>
    <div class="fade-container" id="fadeContainer">
        <!-- Images will be dynamically added here -->
    </div>

    <script>
        const images = [
            "https://via.placeholder.com/500x350/FF5733/FFFFFF?text=Nature+Scene+1",
            "https://via.placeholder.com/500x350/33FF57/FFFFFF?text=Cityscape+2",
            "https://via.placeholder.com/500x350/3357FF/FFFFFF?text=Abstract+3",
            "https://via.placeholder.com/500x350/FF33CC/FFFFFF?text=Mountain+View+4"
        ];

        let currentIndex = 0;
        const fadeContainer = document.getElementById('fadeContainer');
        const intervalTime = 4000; // 4 seconds (1s fade + 3s display)
        let imageElements = [];

        // Preload images and create img elements
        images.forEach((src, index) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Rotating image ${index + 1}`;
            fadeContainer.appendChild(img);
            imageElements.push(img);
        });

        // Initialize first image as active
        if (imageElements.length > 0) {
            imageElements[0].classList.add('active');
        }

        function changeImageWithFade() {
            // Remove 'active' from current image
            imageElements[currentIndex].classList.remove('active');

            // Move to next image
            currentIndex = (currentIndex + 1) % images.length;

            // Add 'active' to new image
            imageElements[currentIndex].classList.add('active');
        }

        // Start the automatic image change with fade
        setInterval(changeImageWithFade, intervalTime);
    </script>
</body>

</html>
